name: Pull Requests

on:
  # PR runs only. A `push` trigger on the same branches ran every PR twice (push + pull_request).
  pull_request:
    branches:
      - development
      - master
      - "releases/**"
  # Manual runs for branches that do not have a PR yet
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    secrets: inherit

